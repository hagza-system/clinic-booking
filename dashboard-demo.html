<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجزة HAGZA | لوحة تحكم الحجوزات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #185fa5; --primary-dark: #0c447c; --primary-light: #c9dcee; --primary-tint: #eef4fa;
    --ink: #23262b; --muted: #767b85; --line: #e6e1d5; --bg: #f2eee5; --paper: #fffdf9;
  }
  body {
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh; padding: 26px 16px 60px;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
  input, select {
    width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
    padding: 0 14px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3.5px var(--primary-tint); }
  .error-msg { font-size: 13px; color: #b3392f; margin-top: 8px; display: none; }
  .btn-primary, .btn-secondary {
    height: 46px; border-radius: 12px; font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .btn-primary { background: var(--primary); border: none; color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #fff; border: 1.5px solid var(--line); color: var(--ink); }

  /* ===== بوابة الدخول ===== */
  #pin-gate { max-width: 360px; margin: 90px auto 0; background: #fff; border-radius: 20px; padding: 30px 26px; box-shadow: 0 16px 40px rgba(30,25,15,.1); text-align: center; }
  #pin-gate h1 { font-family: 'El Messiri', sans-serif; font-size: 18px; margin-bottom: 4px; }
  #pin-gate p { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }

  /* ===== الداشبورد ===== */
  .wrap { max-width: 760px; margin: 0 auto; display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
  .topbar h1 { font-family: 'El Messiri', sans-serif; font-size: 19px; }
  .topbar h1 span { display: block; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  #refresh-btn { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  #refresh-btn:hover { border-color: var(--primary); }

  .stats-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat-card { background: #fff; border-radius: 14px; padding: 14px 18px; flex: 1; min-width: 150px; border: 1px solid var(--line); }
  .stat-card .num { font-size: 20px; font-weight: 700; color: var(--primary-dark); font-family: 'El Messiri', sans-serif; }
  .stat-card .label { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .chart-card { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 16px; }
  .chart-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; font-family: 'El Messiri', sans-serif; color: var(--ink); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { width: 78px; font-size: 12.5px; color: var(--muted); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 16px; background: var(--bg); border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); border-radius: 8px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-value { width: 22px; text-align: left; font-size: 12.5px; font-weight: 700; color: var(--ink); flex-shrink: 0; }
  .chart-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0; }

  .day-group { background: #fff; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 14px; overflow: hidden; }
  .day-group-header { background: var(--primary-tint); padding: 11px 16px; font-weight: 700; font-size: 14px; color: var(--primary-dark); display: flex; justify-content: space-between; }
  .booking-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13.5px; gap: 12px; flex-wrap: wrap; }
  .booking-row .info { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
  .booking-row .info b { color: var(--ink); }
  .booking-row .info .muted-label { color: var(--muted); font-size: 12px; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { border: 1.5px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .icon-btn:hover { border-color: var(--primary); }
  .icon-btn.danger { color: #b3392f; border-color: #f1d4cf; }
  .icon-btn.danger:hover { border-color: #b3392f; }
  .icon-btn:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn:disabled:hover { border-color: #f1d4cf; }
  .empty-day { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ===== مودال التعديل ===== */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,18,14,.45); align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 18px; padding: 26px; max-width: 400px; width: 100%; }
  .modal h2 { font-family: 'El Messiri', sans-serif; font-size: 17px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn-primary, .modal-actions .btn-secondary { flex: 1; }

  /* ===== مواعيد المتابعة (خدمة إضافية) ===== */
  .fu-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line);
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .fu-row .fu-info { display: flex; flex-direction: column; gap: 3px; min-width: 160px; }
  .fu-row .fu-info b { font-size: 13.5px; color: var(--ink); }
  .fu-row .fu-info span { font-size: 12px; color: var(--muted); }
  .fu-status { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .fu-status.pending { background: rgba(234,179,8,0.15); color: #a16207; }
  .fu-status.confirmed { background: rgba(34,197,94,0.15); color: #15803d; }
  .fu-status.reschedule_requested { background: rgba(59,130,246,0.15); color: #1d4ed8; }
  .fu-proposed { font-size: 12px; color: #1d4ed8; font-weight: 600; }
  .fu-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .fu-reschedule-picker { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .fu-reschedule-picker select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 12.5px; }
  .fu-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0; }
  .sm-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .sm-tab-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--muted); font-family: inherit; }
  .sm-tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .sm-broadcast-text { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); font-family: inherit; font-size: 13.5px; resize: vertical; }
  .sm-count-line { font-size: 12.5px; color: var(--muted); margin: 6px 0 14px; }

  /* ===== إشعار عائم (تنبيه إرسال رسالة واتساب) - ثابت في مكانه قدام الدكتورة أياً كان مكانها في الصفحة ===== */
  #notify-banner.notify-toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 420px; z-index: 60;
    box-shadow: 0 12px 32px rgba(20,18,14,.22); animation: notify-in .25s ease-out;
  }
  @keyframes notify-in { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>

<div id="pin-gate">
  <h1>حجزة <span style="font-weight:400;font-size:0.6em;">HAGZA</span></h1>
  <p style="margin-top:-8px;margin-bottom:10px;">لوحة تحكم الحجوزات</p>
  <p>ادخلي بنفس كلمة سر إعدادات العيادة</p>
  <div class="field">
    <input type="password" id="pin-input" placeholder="كلمة السر">
  </div>
  <p class="error-msg" id="pin-error">كلمة السر غير صحيحة</p>
  <button class="btn-primary" id="submit-pin">دخول</button>
</div>

<div class="wrap" id="dashboard">
  <div class="topbar">
    <h1 id="dash-title">لوحة التحكم<span id="dash-subtitle">—</span></h1>
    <button id="refresh-btn">تحديث 🔄</button>
  </div>
  <div id="notify-banner" class="notify-toast" style="display:none; background:#fff; border:1.5px solid #25D366; border-radius:14px; padding:12px 16px;"></div>
  <div class="stats-row" id="stats-row"></div>
  <div class="chart-card">
    <h3>الحجوزات حسب اليوم</h3>
    <div id="day-chart"></div>
  </div>
  <div class="chart-card">
    <h3>الحجوزات حسب الخدمة</h3>
    <div id="service-chart"></div>
  </div>
  <div class="chart-card" id="followup-section" style="display:none;">
    <h3>🎁 مواعيد المتابعة</h3>
    <div class="field">
      <label>اسم المريض</label>
      <input type="text" id="fu-patient-name" placeholder="اسم المريض">
    </div>
    <div class="field">
      <label>رقم موبايل المريض</label>
      <input type="tel" id="fu-phone" placeholder="01xxxxxxxxx" inputmode="numeric">
    </div>
    <div class="field">
      <label>اليوم</label>
      <select id="fu-day-select"></select>
    </div>
    <div class="field">
      <label>الوقت</label>
      <select id="fu-time-select"></select>
    </div>
    <p class="error-msg" id="fu-add-error"></p>
    <button type="button" id="fu-add-btn" class="btn-primary" style="width:100%;">➕ إضافة موعد متابعة</button>
    <div id="fu-list" style="margin-top:18px;"></div>
  </div>

  <div class="chart-card" id="smart-messaging-section" style="display:none;">
    <h3>📣 الرسائل الذكية</h3>
    <div class="sm-tabs">
      <button type="button" class="sm-tab-btn active" data-tab="reminders">تذكيرات بكرة</button>
      <button type="button" class="sm-tab-btn" data-tab="reviews">طلبات تقييم</button>
      <button type="button" class="sm-tab-btn" data-tab="broadcast">رسالة جماعية</button>
      <button type="button" class="sm-tab-btn" data-tab="ratings">التقييمات اللي وصلت</button>
    </div>
    <div class="sm-tab-panel" id="sm-panel-reminders"></div>
    <div class="sm-tab-panel" id="sm-panel-reviews" style="display:none;"></div>
    <div class="sm-tab-panel" id="sm-panel-broadcast" style="display:none;"></div>
    <div class="sm-tab-panel" id="sm-panel-ratings" style="display:none;"></div>
  </div>

  <div class="chart-card">
    <h3>حظر يوم معين (لظروف طارئة)</h3>
    <div class="field">
      <select id="block-date-select"></select>
    </div>
    <button type="button" id="check-block-btn" class="btn-secondary" style="width:100%;">تحقق واحظري اليوم ده</button>
    <div id="block-warning" style="display:none; margin-top:12px;"></div>
    <div id="blocked-dates-list" style="margin-top:14px;"></div>
  </div>
  <div id="days-list"></div>
  <div id="past-list"></div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>تعديل الحجز</h2>
    <div class="field" id="edit-doctor-field" style="display:none;"><label>الدكتور</label><select id="edit-doctor"></select></div>
    <div class="field"><label>اليوم</label><select id="edit-day"></select></div>
    <div class="field"><label>الوقت</label><input type="text" id="edit-time" placeholder="مثال: 3:00 م"></div>
    <div class="field"><label>الخدمة</label><select id="edit-service"></select></div>
    <div class="field"><label>رقم الموبايل</label><input type="tel" id="edit-phone"></div>
    <p class="error-msg" id="edit-error"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel-edit">إلغاء</button>
      <button class="btn-primary" id="save-edit">حفظ التعديل</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://fuhhwbcwwtvtatwkqkps.supabase.co/functions/v1/api";
// معرّف العيادة بيتقرأ من رابط الصفحة (?clinic=xxx)، ولو مفيش بياخد demo-clinic افتراضياً
const CLINIC_ID = new URLSearchParams(location.search).get('clinic') || "demo-clinic";
const baseUrl = 'https://hagza-system.github.io/clinic-booking/';

let settings = {};
let bookings = [];
let enteredPin = null;
let blockedDates = [];
let editingBooking = null;
let followupBookings = [];
let smReminders = [];
let smReviewRequests = [];
let smPatients = [];
let smReviews = [];
let smPatientsLoaded = false;
let smReviewsLoaded = false;

function hexToRgb(hex) {
  hex = (hex || '#185fa5').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16) || 0x185fa5;
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function mixTowards(hex, target, amount) {
  const c = hexToRgb(hex);
  const r = Math.round(c.r + (target.r - c.r) * amount);
  const g = Math.round(c.g + (target.g - c.g) * amount);
  const b = Math.round(c.b + (target.b - c.b) * amount);
  return `rgb(${r},${g},${b})`;
}
function applyTheme(hex) {
  const white = { r: 255, g: 255, b: 255 }, black = { r: 0, g: 0, b: 0 };
  const root = document.documentElement.style;
  root.setProperty('--primary', hex);
  root.setProperty('--primary-dark', mixTowards(hex, black, 0.28));
  root.setProperty('--primary-tint', mixTowards(hex, white, 0.93));
}

function timeSortKey(t) {
  const m = (t || '').match(/(\d+):00 (ص|م)/);
  if (!m) return 0;
  let h = parseInt(m[1], 10);
  if (m[2] === 'م' && h !== 12) h += 12;
  if (m[2] === 'ص' && h === 12) h = 0;
  return h;
}

async function loadSettings() {
  try {
    const res = await fetch(API_URL + '?action=getPublicData&clinicId=' + encodeURIComponent(CLINIC_ID));
    const data = await res.json();
    settings = data.settings || {};
    applyTheme(settings.primaryColor || '#185fa5');
    document.getElementById('dash-subtitle').textContent = settings.clinicName || 'العيادة';
  } catch (err) { /* الإعدادات مش أساسية لفتح صفحة الدخول */ }
}

document.getElementById('submit-pin').addEventListener('click', async () => {
  const pin = document.getElementById('pin-input').value.trim();
  const pinError = document.getElementById('pin-error');
  const btn = document.getElementById('submit-pin');
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getFullBookings', clinicId: CLINIC_ID, pin })
    });
    const result = await res.json();
    btn.disabled = false;
    if (!result.success) {
      pinError.textContent = result.message || 'كلمة السر غير صحيحة';
      pinError.style.display = 'block';
      return;
    }
    enteredPin = pin;
    bookings = result.bookings;
    document.getElementById('pin-gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderDashboard();
  } catch (err) {
    btn.disabled = false;
    pinError.textContent = 'حصل خطأ في الاتصال، حاول تاني';
    pinError.style.display = 'block';
  }
});

document.getElementById('pin-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('submit-pin').click();
});

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'getFullBookings', clinicId: CLINIC_ID, pin: enteredPin })
  });
  const result = await res.json();
  if (result.success) { bookings = result.bookings; renderDashboard(); }
});

function renderDashboard() {
  blockedDates = (settings.blockedDates || '').split(',').map(x => x.trim()).filter(Boolean);
  renderStats();
  renderDaysList();
  renderPastList();
  populateBlockDateSelect();
  renderBlockedDatesList();
  document.getElementById('block-warning').style.display = 'none';

  const followupActive = !!(settings.addons && settings.addons.followup);
  document.getElementById('followup-section').style.display = followupActive ? 'block' : 'none';
  if (followupActive) {
    populateFollowupDaySelect();
    populateFollowupTimeSelect();
    loadFollowupBookings();
    startFollowupAutoRefresh();
  } else {
    stopFollowupAutoRefresh();
  }

  const smartMessagingActive = !!(settings.addons && settings.addons.smart_messaging);
  document.getElementById('smart-messaging-section').style.display = smartMessagingActive ? 'block' : 'none';
  if (smartMessagingActive) {
    loadSmReminders();
    loadSmReviewRequests();
  }
}

function isPastDay(dateStr) {
  const d = parseArabicDateKey(dateStr);
  if (!d) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return d.getTime() < today.getTime();
}

function toWhatsappFormat(localPhone) {
  return '20' + (localPhone || '').replace(/^0/, '');
}

function populateBlockDateSelect() {
  const allowedDays = (settings.days || '').split(',').map(x => x.trim()).filter(Boolean);
  const upcoming = getUpcomingDates(allowedDays, 21).filter(d => !blockedDates.includes(formatDateKey(d)));
  const select = document.getElementById('block-date-select');
  select.innerHTML = upcoming.length
    ? upcoming.map(d => `<option value="${formatDateKey(d)}">${formatDateLabel(d)}</option>`).join('')
    : '<option value="">مفيش أيام متاحة تتحظر</option>';
}

document.getElementById('check-block-btn').addEventListener('click', () => {
  const dateKey = document.getElementById('block-date-select').value;
  if (!dateKey) return;
  const affected = bookings.filter(b => b.day === dateKey);
  const warningDiv = document.getElementById('block-warning');

  let html = '';
  if (affected.length > 0) {
    html += `<p style="color:#b3392f; font-weight:600; margin-bottom:10px; font-size:13.5px;">⚠️ فيه ${affected.length} حجز في اليوم ده - يفضل تبلغي العملاء الأول:</p>`;
    affected.forEach(b => {
      const msg = encodeURIComponent(`مرحباً، للأسف محتاجين نأجل موعدك يوم ${dateKey} الساعة ${b.time} لظرف طارئ في العيادة. تقدر/ي تتواصل معانا نحدد ميعاد بديل يناسبك.`);
      html += `
        <div class="booking-row" style="background:var(--bg); border-radius:10px; margin-bottom:8px; padding:10px 14px; border-top:none;">
          <div class="info"><b>${b.time}</b>${b.doctor ? `<span>${b.doctor}</span>` : ''}<span dir="ltr">${b.phone}</span></div>
          <a href="https://wa.me/${toWhatsappFormat(b.phone)}?text=${msg}" target="_blank" rel="noopener" class="icon-btn" style="text-decoration:none; background:#25D366; color:#fff; border:none;">📱 واتساب</a>
        </div>`;
    });
  } else {
    html += `<p style="color:var(--muted); font-size:13px; margin-bottom:10px;">مفيش حجوزات في اليوم ده - آمن تحظريه.</p>`;
  }
  html += `<button type="button" id="confirm-block-btn" class="btn-primary" style="width:100%; ${affected.length ? 'background:#b3392f;' : ''}">تأكيد حظر اليوم ده</button>`;

  warningDiv.innerHTML = html;
  warningDiv.style.display = 'block';

  document.getElementById('confirm-block-btn').addEventListener('click', async () => {
    const btn = document.getElementById('confirm-block-btn');
    btn.disabled = true;
    btn.textContent = 'جاري الحظر...';
    blockedDates.push(dateKey);
    const ok = await saveBlockedDates();
    if (!ok) { blockedDates = blockedDates.filter(d => d !== dateKey); alert('حصل خطأ، حاول تاني'); }
    warningDiv.style.display = 'none';
    populateBlockDateSelect();
    renderBlockedDatesList();
  });
});

async function saveBlockedDates() {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'updateSettings', clinicId: CLINIC_ID, pin: enteredPin, settings: { blockedDates: blockedDates.join(',') } })
    });
    const result = await res.json();
    return !!result.success;
  } catch (err) {
    return false;
  }
}

function renderBlockedDatesList() {
  const container = document.getElementById('blocked-dates-list');
  if (blockedDates.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = '<p style="font-size:12px; color:var(--muted); margin-bottom:8px;">أيام محظورة حالياً:</p>' +
    blockedDates.map(dk => `
      <div class="booking-row" style="border-top:none; padding:8px 0;">
        <div class="info"><b>${dk}</b></div>
        <button type="button" class="icon-btn unblock-btn" data-date="${dk}">إلغاء الحظر</button>
      </div>`).join('');
  container.querySelectorAll('.unblock-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const removed = btn.dataset.date;
      blockedDates = blockedDates.filter(d => d !== removed);
      const ok = await saveBlockedDates();
      if (!ok) { blockedDates.push(removed); alert('حصل خطأ، حاول تاني'); }
      populateBlockDateSelect();
      renderBlockedDatesList();
    });
  });
}

function renderStats() {
  const upcomingBookings = bookings.filter(b => !isPastDay(b.day));
  const total = upcomingBookings.length;
  const perDay = {}, perService = {};
  upcomingBookings.forEach(b => {
    perDay[b.day] = (perDay[b.day] || 0) + 1;
    perService[b.service] = (perService[b.service] || 0) + 1;
  });
  let busiestDay = '—', maxDay = 0;
  Object.entries(perDay).forEach(([d, c]) => { if (c > maxDay) { maxDay = c; busiestDay = d; } });
  let topService = '—', maxService = 0;
  Object.entries(perService).forEach(([s, c]) => { if (c > maxService) { maxService = c; topService = s; } });

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">إجمالي الحجوزات الحالية</div></div>
    <div class="stat-card"><div class="num">${busiestDay}</div><div class="label">أكتر يوم مطلوب</div></div>
    <div class="stat-card"><div class="num">${topService}</div><div class="label">أكتر خدمة مطلوبة</div></div>
  `;

  const dayOrder = Object.keys(perDay).sort((a, b) => (parseArabicDateKey(a) || 0) - (parseArabicDateKey(b) || 0));
  renderBarChart('day-chart', perDay, dayOrder);

  const serviceOrder = Object.keys(perService).sort((a, b) => perService[b] - perService[a]);
  renderBarChart('service-chart', perService, serviceOrder);
}

function renderBarChart(containerId, dataObj, orderedKeys) {
  const container = document.getElementById(containerId);
  const maxVal = Math.max(1, ...Object.values(dataObj));
  const keysWithData = orderedKeys.length ? orderedKeys : Object.keys(dataObj);

  if (keysWithData.length === 0 || Object.values(dataObj).every(v => v === 0)) {
    container.innerHTML = '<p class="chart-empty">مفيش بيانات كفاية لسه</p>';
    return;
  }

  container.innerHTML = keysWithData.map(key => {
    const value = dataObj[key] || 0;
    const pct = Math.round((value / maxVal) * 100);
    return `
      <div class="bar-row">
        <span class="bar-label">${key}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span class="bar-value">${value}</span>
      </div>`;
  }).join('');
}

const ARABIC_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

function parseArabicDateKey(dateStr) {
  const parts = (dateStr || '').trim().split(' ');
  if (parts.length < 4) return null;
  const day = parseInt(parts[1], 10);
  const monthIndex = ARABIC_MONTHS.indexOf(parts[2]);
  const year = parseInt(parts[3], 10);
  if (isNaN(day) || monthIndex === -1 || isNaN(year)) return null;
  return new Date(year, monthIndex, day);
}

const ARABIC_DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

// بيقرا اسم الدكتور بس من السطر ("اسم:رقم" أو "اسم,رقم" - بيتقبل الاتنين عشان لو حد كتبها غلط)
function parseDoctorLineName(line) {
  let sep = line.indexOf(':');
  if (sep === -1) {
    const m = line.match(/[,،](?=\s*\d)/);
    if (m) sep = m.index;
  }
  return sep === -1 ? line.trim() : line.slice(0, sep).trim();
}

function normalizeArabicDay(s) {
  return (s || '').trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');
}
const ARABIC_DAY_TO_NUM = {};
ARABIC_DAY_NAMES.forEach((name, i) => { ARABIC_DAY_TO_NUM[normalizeArabicDay(name)] = i; });

function formatDateLabel(date) {
  return `${ARABIC_DAY_NAMES[date.getDay()]} ${date.getDate()} ${ARABIC_MONTHS[date.getMonth()]}`;
}
function formatDateKey(date) {
  return `${ARABIC_DAY_NAMES[date.getDay()]} ${date.getDate()} ${ARABIC_MONTHS[date.getMonth()]} ${date.getFullYear()}`;
}
function getUpcomingDates(allowedDayNames, windowDays) {
  const allowedNums = allowedDayNames.map(d => ARABIC_DAY_TO_NUM[normalizeArabicDay(d)]).filter(n => n !== undefined);
  const dates = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 0; i < (windowDays || 21); i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    if (allowedNums.includes(d.getDay())) dates.push(d);
  }
  return dates;
}

function openEdit(booking) {
  editingBooking = booking;
  const allowedDays = (settings.days || '').split(',').map(x => x.trim()).filter(Boolean);
  const upcomingDates = getUpcomingDates(allowedDays, 21);
  const serviceOptions = (settings.services || '').split(',').map(x => x.trim()).filter(Boolean);
  const doctorOptions = (settings.doctors || '').split('\n').map(line => line.trim()).filter(Boolean).map(parseDoctorLineName);

  const daySelect = document.getElementById('edit-day');
  const dateOptionsHtml = upcomingDates.map(d => {
    const key = formatDateKey(d);
    return `<option value="${key}" ${key === booking.day ? 'selected' : ''}>${formatDateLabel(d)}</option>`;
  }).join('');
  // لو تاريخ الحجز الأصلي مبقاش ضمن الأيام الجاية (مثلاً حجز قديم)، ضيفيه في الأول عشان ميضيعش
  daySelect.innerHTML = upcomingDates.some(d => formatDateKey(d) === booking.day)
    ? dateOptionsHtml
    : `<option value="${booking.day}" selected>${booking.day}</option>` + dateOptionsHtml;

  const serviceSelect = document.getElementById('edit-service');
  serviceSelect.innerHTML = serviceOptions.map(s => `<option ${s === booking.service ? 'selected' : ''}>${s}</option>`).join('');

  const doctorField = document.getElementById('edit-doctor-field');
  if (doctorOptions.length > 1) {
    doctorField.style.display = 'block';
    document.getElementById('edit-doctor').innerHTML = doctorOptions.map(d => `<option ${d === booking.doctor ? 'selected' : ''}>${d}</option>`).join('');
  } else {
    doctorField.style.display = 'none';
  }

  document.getElementById('edit-time').value = booking.time;
  document.getElementById('edit-phone').value = booking.phone;
  document.getElementById('edit-error').style.display = 'none';
  document.getElementById('edit-modal').classList.add('open');
}

document.getElementById('save-edit').addEventListener('click', async () => {
  const editError = document.getElementById('edit-error');
  const newPhone = document.getElementById('edit-phone').value.trim();
  const newTime = document.getElementById('edit-time').value.trim();

  if (!/^01[0-9]{9}$/.test(newPhone)) {
    editError.textContent = 'رقم الموبايل مش صحيح (01xxxxxxxxx)';
    editError.style.display = 'block';
    return;
  }
  if (!newTime) {
    editError.textContent = 'اكتب الوقت';
    editError.style.display = 'block';
    return;
  }

  const saveBtn = document.getElementById('save-edit');
  saveBtn.disabled = true;
  saveBtn.textContent = 'جاري الحفظ...';

  const doctorFieldVisible = document.getElementById('edit-doctor-field').style.display !== 'none';
  const payload = {
    action: 'updateBooking', clinicId: CLINIC_ID, pin: enteredPin,
    id: editingBooking.id,
    newDay: document.getElementById('edit-day').value,
    newTime: newTime,
    newService: document.getElementById('edit-service').value,
    newPhone: newPhone,
    newDoctor: doctorFieldVisible ? document.getElementById('edit-doctor').value : (editingBooking.doctor || '')
  };

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    saveBtn.disabled = false;
    saveBtn.textContent = 'حفظ التعديل';

    if (!result.success) {
      editError.textContent = result.message || 'حصل خطأ، حاول تاني';
      editError.style.display = 'block';
      return;
    }

    Object.assign(editingBooking, { day: payload.newDay, time: payload.newTime, service: payload.newService, phone: payload.newPhone, doctor: payload.newDoctor });
    document.getElementById('edit-modal').classList.remove('open');
    renderDashboard();
    showNotifyBanner(editingBooking, `مرحباً، تم تعديل موعدك ليبقى يوم ${payload.newDay} الساعة ${payload.newTime}. لو محتاج/ة أي توضيح كلمينا.`);
  } catch (err) {
    saveBtn.disabled = false;
    saveBtn.textContent = 'حفظ التعديل';
    editError.textContent = 'حصل خطأ في الاتصال، حاول تاني';
    editError.style.display = 'block';
  }
});

// ====== مواعيد المتابعة (خدمة إضافية: followup) ======
function buildTimeSlots(startHour, endHour) {
  const slots = [];
  for (let h = startHour; h < endHour; h++) {
    const period = h < 12 ? 'ص' : 'م';
    let displayH = h % 12;
    if (displayH === 0) displayH = 12;
    slots.push(displayH + ':00 ' + period);
    slots.push(displayH + ':30 ' + period);
  }
  return slots;
}

function populateFollowupDaySelect(selectEl) {
  // الأيام كلها متاحة هنا بغض النظر عن أيام عمل العيادة العادية
  const upcoming = getUpcomingDates(ARABIC_DAY_NAMES, 60);
  const select = selectEl || document.getElementById('fu-day-select');
  select.innerHTML = upcoming.length
    ? upcoming.map(d => `<option value="${formatDateKey(d)}">${formatDateLabel(d)}</option>`).join('')
    : '<option value="">مفيش أيام متاحة</option>';
}

function populateFollowupTimeSelect(selectEl) {
  // كل الأوقات على مدار اليوم متاحة هنا بغض النظر عن مواعيد عمل العيادة العادية
  const slots = buildTimeSlots(0, 24);
  const select = selectEl || document.getElementById('fu-time-select');
  select.innerHTML = slots.map((t) => `<option>${t}</option>`).join('');
}

async function loadFollowupBookings() {

let followupPollTimer = null;
function startFollowupAutoRefresh() {
  if (followupPollTimer) return;
  followupPollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') loadFollowupBookings();
  }, 20000);
}
function stopFollowupAutoRefresh() {
  if (followupPollTimer) { clearInterval(followupPollTimer); followupPollTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && followupPollTimer) loadFollowupBookings();
});

    btn.addEventListener('click', async () => {
      if (!confirm('متأكدة إنك عايزة تلغي موعد المتابعة ده؟')) return;
      const fuBooking = followupBookings.find((x) => String(x.id) === btn.dataset.id);
      btn.disabled = true;
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'cancelFollowupBooking', clinicId: CLINIC_ID, pin: enteredPin, id: btn.dataset.id })
      });
      const result = await res.json();
      if (result.success) {
        followupBookings = followupBookings.filter((x) => String(x.id) !== btn.dataset.id);
        renderFollowupList();
        if (fuBooking) {
          showNotifyBanner(fuBooking, `مرحباً، للأسف تم إلغاء موعد المتابعة بتاعك يوم ${fuBooking.day} الساعة ${fuBooking.time}. تقدر/ي تتواصل معانا نحدد ميعاد بديل يناسبك.`);
        }
      } else {
        alert(result.message || 'حصل خطأ');
        btn.disabled = false;
      }
    });
  });
  container.querySelectorAll('.fu-update-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const row = container.querySelector(`.fu-row[data-id="${id}"]`);
      const daySelect = row.querySelector('.fu-new-day-select');
      const timeSelect = row.querySelector('.fu-new-time-select');
      const day = daySelect.options[daySelect.selectedIndex] ? daySelect.options[daySelect.selectedIndex].textContent : '';
      const time = timeSelect.value;
      if (!day || !time) { alert('اختار يوم ووقت'); return; }
      btn.disabled = true;
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'updateFollowupBooking', clinicId: CLINIC_ID, pin: enteredPin, id, day, time })
      });
      const result = await res.json();
      if (result.success) {
        await loadFollowupBookings();
        const updated = followupBookings.find((x) => String(x.id) === String(id));
        if (updated) sendFollowupWhatsapp(updated);
      } else {
        alert(result.message || 'حصل خطأ');
        btn.disabled = false;
      }
    });
  });
}

document.getElementById('fu-add-btn').addEventListener('click', async () => {
  const errorEl = document.getElementById('fu-add-error');
  errorEl.style.display = 'none';
  const patientName = document.getElementById('fu-patient-name').value.trim();
  const phone = document.getElementById('fu-phone').value.trim();
  const day = document.getElementById('fu-day-select').value;
  const time = document.getElementById('fu-time-select').value;

  if (!patientName) { errorEl.textContent = 'من فضلك اكتب اسم المريض'; errorEl.style.display = 'block'; return; }
  if (!/^01[0-9]{9}$/.test(phone)) { errorEl.textContent = 'رقم الموبايل غير صحيح'; errorEl.style.display = 'block'; return; }
  if (!day || !time) { errorEl.textContent = 'من فضلك اختار اليوم والوقت'; errorEl.style.display = 'block'; return; }

  const btn = document.getElementById('fu-add-btn');
  btn.disabled = true;
  btn.textContent = 'جاري الإضافة...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'createFollowupBooking', clinicId: CLINIC_ID, pin: enteredPin, patientName, phone, day, time })
    });
    const result = await res.json();
    btn.disabled = false;
    btn.textContent = '➕ إضافة موعد متابعة';
    if (!result.success) {
      errorEl.textContent = result.message || 'حصل خطأ، حاول تاني';
      errorEl.style.display = 'block';
      return;
    }
    document.getElementById('fu-patient-name').value = '';
    document.getElementById('fu-phone').value = '';
    await loadFollowupBookings();
    sendFollowupWhatsapp({ id: result.id, patientName, phone, day, time });
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '➕ إضافة موعد متابعة';
    errorEl.textContent = 'حصل خطأ في الاتصال، حاول تاني';
    errorEl.style.display = 'block';
  }
});

// ================== الرسائل الذكية (خدمة إضافية: smart_messaging) ==================
document.querySelectorAll('.sm-tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sm-tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.sm-tab-panel').forEach((p) => { p.style.display = 'none'; });
    document.getElementById('sm-panel-' + btn.dataset.tab).style.display = 'block';
    if (btn.dataset.tab === 'broadcast' && !smPatientsLoaded) loadSmPatients();
    if (btn.dataset.tab === 'ratings' && !smReviewsLoaded) loadSmReviews();
  });
});

function reviewLink(id) {
  return `${baseUrl}review.html?clinic=${encodeURIComponent(CLINIC_ID)}&id=${encodeURIComponent(id)}`;
}

async function loadSmReminders() {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getDueReminders', clinicId: CLINIC_ID, pin: enteredPin })
    });
    const result = await res.json();
    if (result.success) { smReminders = result.reminders || []; renderSmReminders(); }
  } catch (err) { /* غير حرج */ }
}

function renderSmReminders() {
  const el = document.getElementById('sm-panel-reminders');
  if (!smReminders.length) { el.innerHTML = '<p class="fu-empty">مفيش تذكيرات مستحقة دلوقتي</p>'; return; }
  el.innerHTML = smReminders.map((b) => {
    const clinicName = settings.clinicName || 'العيادة';
    const msg = encodeURIComponent(`مرحباً ${b.patientName}، تذكير بمعادك بكرة في ${clinicName} الساعة ${b.time}. في انتظارك! 🌸`);
    const link = `https://wa.me/${toWhatsappFormat(b.phone)}?text=${msg}`;
    return `
    <div class="fu-row" data-id="${b.id}">
      <div class="fu-info">
        <b>${b.patientName || 'بدون اسم'}</b>
        <span dir="ltr">${b.phone}</span>
        <span>${b.day} — ${b.time}${b.service ? ' — ' + b.service : ''}</span>
      </div>
      <div class="fu-actions">
        <a class="icon-btn sm-reminder-send" data-id="${b.id}" href="${link}" target="_blank" rel="noopener">📱 إرسال التذكير</a>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.sm-reminder-send').forEach((a) => {
    a.addEventListener('click', async () => {
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'markReminderSent', clinicId: CLINIC_ID, pin: enteredPin, id: a.dataset.id })
        });
      } catch (err) { /* غير حرج */ }
      smReminders = smReminders.filter((x) => String(x.id) !== a.dataset.id);
      renderSmReminders();
    });
  });
}

async function loadSmReviewRequests() {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getDueReviewRequests', clinicId: CLINIC_ID, pin: enteredPin })
    });
    const result = await res.json();
    if (result.success) { smReviewRequests = result.requests || []; renderSmReviewRequests(); }
  } catch (err) { /* غير حرج */ }
}

function renderSmReviewRequests() {
  const el = document.getElementById('sm-panel-reviews');
  if (!smReviewRequests.length) { el.innerHTML = '<p class="fu-empty">مفيش طلبات تقييم مستحقة دلوقتي</p>'; return; }
  el.innerHTML = smReviewRequests.map((b) => {
    const clinicName = settings.clinicName || 'العيادة';
    const link = reviewLink(b.id);
    const msg = encodeURIComponent(`مرحباً ${b.patientName}، تشرفنا بزيارتك في ${clinicName}. نتمنى تقييم تجربتك معنا من الرابط ده: ${link} 🙏`);
    const waLink = `https://wa.me/${toWhatsappFormat(b.phone)}?text=${msg}`;
    return `
    <div class="fu-row" data-id="${b.id}">
      <div class="fu-info">
        <b>${b.patientName || 'بدون اسم'}</b>
        <span dir="ltr">${b.phone}</span>
        <span>${b.day} — ${b.time}</span>
      </div>
      <div class="fu-actions">
        <a class="icon-btn sm-review-send" data-id="${b.id}" href="${waLink}" target="_blank" rel="noopener">📱 طلب تقييم</a>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.sm-review-send').forEach((a) => {
    a.addEventListener('click', async () => {
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'markReviewRequested', clinicId: CLINIC_ID, pin: enteredPin, id: a.dataset.id })
        });
      } catch (err) { /* غير حرج */ }
      smReviewRequests = smReviewRequests.filter((x) => String(x.id) !== a.dataset.id);
      renderSmReviewRequests();
    });
  });
}

async function loadSmPatients() {
  smPatientsLoaded = true;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getPatientsForBroadcast', clinicId: CLINIC_ID, pin: enteredPin })
    });
    const result = await res.json();
    if (result.success) { smPatients = result.patients || []; }
  } catch (err) { /* غير حرج */ }
  renderSmBroadcast();
}

function renderSmBroadcast() {
  const el = document.getElementById('sm-panel-broadcast');
  el.innerHTML = `
    <div class="field">
      <label>نص الرسالة (هيتفتح واتساب بنفس النص لكل مريض تضغطي عليه)</label>
      <textarea id="sm-broadcast-text" class="sm-broadcast-text" rows="3" placeholder="اكتبي رسالتك هنا..."></textarea>
    </div>
    <p class="sm-count-line">عدد المرضى المسجلين: ${smPatients.length}</p>
    <div id="sm-broadcast-list"></div>`;
  const listEl = document.getElementById('sm-broadcast-list');
  if (!smPatients.length) { listEl.innerHTML = '<p class="fu-empty">لسه مفيش مرضى مسجلين</p>'; return; }
  listEl.innerHTML = smPatients.map((p) => `
    <div class="fu-row">
      <div class="fu-info">
        <b>${p.patientName || 'بدون اسم'}</b>
        <span dir="ltr">${p.phone}</span>
      </div>
      <div class="fu-actions">
        <button type="button" class="icon-btn sm-broadcast-send" data-phone="${p.phone}">📱 إرسال</button>
      </div>
    </div>`).join('');
  listEl.querySelectorAll('.sm-broadcast-send').forEach((btn) => {
    btn.addEventListener('click', () => {
      const text = document.getElementById('sm-broadcast-text').value.trim();
      if (!text) { alert('من فضلك اكتبي نص الرسالة الأول'); return; }
      window.open(`https://wa.me/${toWhatsappFormat(btn.dataset.phone)}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
    });
  });
}

async function loadSmReviews() {
  smReviewsLoaded = true;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getReviews', clinicId: CLINIC_ID, pin: enteredPin })
    });
    const result = await res.json();
    if (result.success) { smReviews = result.reviews || []; }
  } catch (err) { /* غير حرج */ }
  renderSmReviews();
}

function renderSmReviews() {
  const el = document.getElementById('sm-panel-ratings');
  if (!smReviews.length) { el.innerHTML = '<p class="fu-empty">لسه مفيش تقييمات وصلت</p>'; return; }
  el.innerHTML = smReviews.map((r) => `
    <div class="fu-row">
      <div class="fu-info">
        <b>${r.patientName || 'مريض'}</b>
        <span>${r.day}</span>
        ${r.comment ? `<span>${r.comment}</span>` : ''}
      </div>
      <span class="fu-status confirmed">${'⭐'.repeat(r.rating)}</span>
    </div>`).join('');
}

loadSettings();
